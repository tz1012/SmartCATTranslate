[package]
name = "smartcat-translate"
default-run = "smartcat-translate"
version = "0.1.8"
description = "SmartCAT Translate"
authors = ["SmartCAT Translate"]
edition = "2021"

[features]
test-helper = []

[lib]
name = "smartcat_translate"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "smartcat-fake-codex"
path = "test-support/fake_codex_process.rs"
required-features = ["test-helper"]
test = false
bench = false

[[bin]]
name = "verify-updater-key"
path = "release-support/verify_updater_key.rs"
bench = false

[build-dependencies]
cc = "1"
tauri-build = { version = "2", features = [] }

[dependencies]
async-trait = "0.1"
aes-gcm = "0.10"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
flate2 = "1"
base64 = "0.22"
keyring = "3"
cosmic-text = "0.14"
image = { version = "0.25", default-features = false, features = ["bmp", "jpeg", "png", "tiff", "webp"] }
lopdf = { version = "0.38", default-features = false, features = ["rayon"] }
minisign-verify = "=0.2.5"
unicode-normalization = "0.1"
regex = "1"
rand = "0.8"
quick-xml = "0.41"
reqwest = { version = "0.13", default-features = false, features = ["native-tls-no-alpn"] }
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
sha2 = "0.10"
tar = "0.4"
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-opener = "2"
tauri-plugin-updater = "=2.10.1"
tauri-plugin-dialog = "=2.7.2"
tauri-plugin-autostart = "2"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-util", "macros", "process", "rt", "sync", "time"] }
toml = "0.9"
url = "2"
uuid = { version = "1", features = ["serde", "v4", "v5"] }
zip = { version = "4", default-features = false, features = ["deflate"] }
zeroize = "1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = ["Data_Pdf", "Foundation", "Globalization", "Graphics_Imaging", "Media_Ocr", "Storage", "Storage_Streams", "Win32_System_WinRT"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_SystemInformation", "Win32_System_Threading", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"

[dev-dependencies]
jsonschema = { version = "0.37", default-features = false }
tokio = { version = "1", features = ["macros", "rt"] }
