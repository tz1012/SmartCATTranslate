[package]
name = "smartcat-translate"
version = "0.1.0"
description = "SmartCAT Translate"
authors = ["SmartCAT Translate"]
edition = "2021"

[features]
test-helper = []

[lib]
name = "smartcat_translate"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "smartcat-fake-codex"
path = "test-support/fake_codex_process.rs"
required-features = ["test-helper"]
test = false
bench = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
async-trait = "0.1"
chrono = { version = "0.4", default-features = false, features = ["std"] }
flate2 = "1"
regex = "1"
reqwest = { version = "0.13", default-features = false, features = ["native-tls-no-alpn"] }
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tar = "0.4"
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-util", "macros", "process", "rt", "sync", "time"] }
toml = "0.9"
url = "2"
uuid = { version = "1", features = ["serde", "v4"] }
zip = { version = "4", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_SystemInformation"] }

[dev-dependencies]
jsonschema = { version = "0.37", default-features = false }
tokio = { version = "1", features = ["macros", "rt"] }
