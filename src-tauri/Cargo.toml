[package]
name = "smartcat-translate"
version = "0.1.0"
description = "SmartCAT Translate"
authors = ["SmartCAT Translate"]
edition = "2021"

[lib]
name = "smartcat_translate"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
async-trait = "0.1"
flate2 = "1"
regex = "1"
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tar = "0.4"
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["io-util", "macros", "rt", "sync"] }
url = "2"
zip = { version = "4", default-features = false, features = ["deflate"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }
