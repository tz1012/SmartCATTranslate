[package]
name = "smartcat-translate"
version = "0.1.0"
description = "SmartCAT Translate"
authors = ["SmartCAT Translate"]
edition = "2021"

[lib]
name = "smartcat_translate"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
async-trait = "0.1"
regex = "1"
semver = "1"
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
tauri = { version = "2", features = [] }
thiserror = "2"
url = "2"

[dev-dependencies]
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt"] }
