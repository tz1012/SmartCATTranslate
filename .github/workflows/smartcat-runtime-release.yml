name: SmartCAT patched runtime release build

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  build-runtime-and-installer:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            sidecar: smartcat-codex-x86_64-pc-windows-msvc.exe
          - os: macos-15-intel
            target: x86_64-apple-darwin
            sidecar: smartcat-codex-x86_64-apple-darwin
          - os: macos-15
            target: aarch64-apple-darwin
            sidecar: smartcat-codex-aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: ${{ matrix.target }}
          components: clippy,rustfmt
      - run: pnpm install --frozen-lockfile
      - name: Install pinned Rust SBOM generator
        run: cargo install cargo-cyclonedx --version 0.5.9 --locked
      - name: Verify pinned source and patch build contract
        run: pnpm runtime:build:test
      - name: Build and test audited patched runtime
        env:
          SMARTCAT_CODEX_CARGO_TARGET_DIR: ${{ runner.temp }}/smartcat-codex-target
        run: pnpm runtime:build -- --target ${{ matrix.target }}
      - name: Verify the app accepts the exact patched live session
        env:
          SMARTCAT_PATCHED_CODEX_TEST_BINARY: ${{ github.workspace }}/src-tauri/binaries/${{ matrix.sidecar }}
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --features test-helper --test codex_bootstrap actual_patched_sidecar_initializes_and_attests_on_the_live_session -- --ignored --exact
      - name: Test SmartCAT application
        run: pnpm test
      - name: Test SmartCAT Rust boundary
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --features test-helper
      - name: Check SmartCAT Rust boundary
        run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets --features test-helper -- -D warnings -A clippy::result-unit-err
      - name: Generate locked SmartCAT Rust dependency SBOM
        run: pnpm release:sbom:cargo -- --manifest src-tauri/Cargo.toml --lock src-tauri/Cargo.lock --target ${{ matrix.target }} --output-stem smartcat-app-rust-${{ matrix.target }}.dependencies.cdx --destination artifacts/smartcat-app-rust-${{ matrix.target }}.dependencies.cdx.json
      - name: Build signed-ready Tauri installer with the patched sidecar
        run: pnpm tauri build --config src-tauri/tauri.runtime.conf.json --target ${{ matrix.target }}
      - name: Generate pinned workspace dependency SBOM
        uses: anchore/sbom-action@v0.20.10
        with:
          path: .
          format: cyclonedx-json
          output-file: artifacts/smartcat-${{ matrix.target }}.workspace.cdx.json
          syft-version: v1.51.0
          upload-artifact: false
      - name: Discover and checksum the sidecar and every installer
        run: pnpm release:evidence -- --target ${{ matrix.target }} --sidecar src-tauri/binaries/${{ matrix.sidecar }} --bundle-root src-tauri/target/${{ matrix.target }}/release/bundle --output-root artifacts
      - name: Verify every dependency and artifact SBOM plus artifact checksum
        run: pnpm release:sbom:verify -- --checksums artifacts/smartcat-${{ matrix.target }}.sha256 --dependency src-tauri/binaries/smartcat-codex-${{ matrix.target }}.runtime.cdx.json --dependency artifacts/smartcat-app-rust-${{ matrix.target }}.dependencies.cdx.json --inventory artifacts/smartcat-${{ matrix.target }}.workspace.cdx.json --inventory artifacts/smartcat-${{ matrix.target }}.artifacts.cdx.json
      - name: Attest sidecar and installer provenance from verified checksums
        id: provenance
        uses: actions/attest-build-provenance@v3
        with:
          subject-checksums: artifacts/smartcat-${{ matrix.target }}.sha256
      - name: Publish explicit release-workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: smartcat-${{ matrix.target }}
          if-no-files-found: error
          path: |
            src-tauri/binaries/smartcat-codex-${{ matrix.target }}*
            src-tauri/resources/smartcat-codex-runtime.json
            artifacts/smartcat-${{ matrix.target }}.sha256
            artifacts/smartcat-${{ matrix.target }}.*.cdx.json
            artifacts/smartcat-app-rust-${{ matrix.target }}.dependencies.cdx.json
            ${{ steps.provenance.outputs.bundle-path }}
            src-tauri/target/${{ matrix.target }}/release/bundle/**
